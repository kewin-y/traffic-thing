[project]
name = "traffic-worker"
version = "0.1.0"
description = "Isolated SUMO simulation worker for traffic scenarios"
requires-python = ">=3.12,<3.13"
dependencies = [
  "eclipse-sumo==1.28.0",
  "sumolib==1.28.0",
  "traci==1.28.0",
  "libsumo==1.28.0",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "torch>=2.6,<3",
  "torch-geometric>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The predictor runs on CPU only; keep the CUDA wheels out of the image.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8,<10"]
import = ["pyproj>=3.7,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

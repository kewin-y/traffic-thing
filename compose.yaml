services:
  worker:
    build:
      context: ./worker
    ports:
      - "8000:8000"
    environment:
      WORKER_API_KEY: ${WORKER_API_KEY:?Export WORKER_API_KEY before starting the worker}
      NETWORK_ROOT: /data/networks
      TIMELINE_ROOT: /data/timelines
      SIMULATION_TIMEOUT_SECONDS: ${SIMULATION_TIMEOUT_SECONDS:-120}
      MAX_CONCURRENT_SIMULATIONS: ${MAX_CONCURRENT_SIMULATIONS:-1}
    volumes:
      - type: bind
        source: ./networks
        target: /data/networks
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: timelines
        target: /data/timelines

volumes:
  timelines:
